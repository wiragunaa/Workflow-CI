name: CI/CD Pipeline for MLProject

on:
  push:
    branches:
      - main 

jobs:
  build-and-train:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: file:./MLProject/mlruns
    steps:
      - name: Set up job
        run: echo "Starting training pipeline"

      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          python --version
          env | sort

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas numpy scikit-learn matplotlib seaborn

      - name: Run mlflow project
        run: |
          cd MLProject
          mkdir -p mlruns
          export MLFLOW_TRACKING_URI=file:./mlruns
          mlflow run . --env-manager=local

      - name: Get latest Mlflow run_id
        run: |
          cd MLProject
          if [ -d "mlruns/0" ]; then
            RUN_ID=$(ls -1t mlruns/0 | head -n1)
            echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
            echo "Detected RUN_ID=$RUN_ID"
          else
            echo "mlruns/0 not found"; exit 1
          fi

      - name: Install Python dependencies
        run: |
          if [ -f MLProject/requirements.txt ]; then
            pip install -r MLProject/requirements.txt
          else
            echo "No requirements.txt found, skipping"
          fi

      - name: Upload to GitHub (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: |
            MLProject/mlruns
            MLProject/mlflow_artifacts

      - name: Build Docker Model
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_REPO: ${{ secrets.DOCKER_REPOSITORY }}
        run: |
          cd MLProject
          echo "Using RUN_ID=${RUN_ID}"
          IMAGE_NAME="${DOCKER_USER}/${DOCKER_REPO}:${GITHUB_SHA}"
          mlflow models build-docker -m "runs:/${RUN_ID}/model" -n "$IMAGE_NAME"
          echo "Built $IMAGE_NAME"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker Image
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_REPO: ${{ secrets.DOCKER_REPOSITORY }}
        run: |
          IMAGE_SHA_TAG="${DOCKER_USER}/${DOCKER_REPO}:${GITHUB_SHA}"
          IMAGE_LATEST_TAG="${DOCKER_USER}/${DOCKER_REPO}:latest"
          docker tag "$IMAGE_SHA_TAG" "$IMAGE_LATEST_TAG" || echo "Tag already exists or tagging failed"

      - name: Push Docker Image
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_REPO: ${{ secrets.DOCKER_REPOSITORY }}
        run: |
          IMAGE_SHA_TAG="${DOCKER_USER}/${DOCKER_REPO}:${GITHUB_SHA}"
          IMAGE_LATEST_TAG="${DOCKER_USER}/${DOCKER_REPO}:latest"
          docker push "$IMAGE_SHA_TAG"
          docker push "$IMAGE_LATEST_TAG" || echo "Push may have failed for one of the tags"
